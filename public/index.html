<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gael's desktop</title>
    
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="/css/style.css?v={{CACHE_VERSION}}">
</head>
<body>
    <div id="sound-toggle-button" class="sound-toggle-button" title="Ativar/Desativar som">
        <svg class="icon-sound-on" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg class="icon-sound-off" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
    </div>

    <div id="music-toggle-button" class="music-toggle-button" title="Tocar/Pausar música">
        <svg class="icon-music-on" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <svg class="icon-music-off" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
            <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
    </div>

    <main class="explorer-window">
        <header class="right-pane-header">
            <button id="back-button" class="back-button" title="Go back">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            </button>
        </header>
        <div class="explorer-body">
            <nav id="nav-pane" class="nav-pane"></nav>
            <section id="content-pane" class="content-pane"></section>
        </div>
    </main>

    <div id="file-modal" class="modal-overlay"></div>
    <div id="about-modal" class="modal-overlay"></div>
    <div id="image-modal" class="modal-overlay image-modal-overlay"></div>
    <div id="project-modal" class="modal-overlay"></div>
    <div id="markdown-modal" class="modal-overlay"></div>
    <div id="skills-modal" class="modal-overlay"></div>
    <div id="links-modal" class="modal-overlay"></div>
    <div id="contact-modal" class="modal-overlay"></div>

    <audio id="audio-open" src="/audio/sound-open.mp3" preload="auto"></audio>
    <audio id="audio-close" src="/audio/sound-close.mp3" preload="auto"></audio>
    <audio id="audio-hover" src="/audio/sound-hover.mp3" preload="auto"></audio>
    <audio id="audio-music" src="/audio/background-music.mp3" loop preload="auto"></audio>

    <script src="/js/main.js?v={{CACHE_VERSION}}" type="module" defer></script>
</body>
</html>
